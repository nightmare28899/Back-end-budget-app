services:
    backend:
        build: .
        ports:
            - "3001:3000"
        env_file:
            - .env
        environment:
            DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@host.docker.internal:5432/budgetapp?schema=public}
            MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
            MINIO_PORT: ${MINIO_PORT:-9000}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
            MINIO_BUCKET: ${MINIO_BUCKET:-app-uploads}
            MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
            FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
        volumes:
            - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
